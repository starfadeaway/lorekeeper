[pytest]
# backend/ 下的代码用 `from app.xxx import` 这种绝对导入，
# 所以要把 backend 放进 sys.path，否则 pytest 从仓库根跑会 ImportError。
# （这份配置原本在 pyproject.toml 的 [tool.pytest.ini_options] 里；
#   拆出来是因为 pyproject.toml 不入库，而这份配置必须跟着仓库走。）
pythonpath = backend
testpaths = backend/tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -q --strict-markers
markers =
    slow: 需要真实网络/API 的用例，CI 默认跳过
    needs_corpus: 需要本地已抓好的语料（data/raw），没有就 skip
